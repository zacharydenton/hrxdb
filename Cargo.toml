[package]
name = "hrxdb"
version = "0.3.1"
edition = "2024"
rust-version = "1.91"
description = "A GPU-powered vector database for unified-memory systems, built on HRX and Loom"
license = "MIT"
readme = "README.md"
repository = "https://github.com/zacharydenton/hrxdb"
documentation = "https://docs.rs/hrxdb"
keywords = ["vector-database", "unified-memory", "gpu", "hrx", "loom-kernels"]
categories = ["database", "science", "algorithms"]
include = ["/src/**", "/kernels/**", "/examples/**", "/tests/**", "/docs/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/CHANGELOG.md", "/CONTRIBUTING.md", "/RELEASE.md", "/LICENSE"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
# Cargo.lock records the qualified runtime and Loom compiler bundle.
hrx = { package = "hrx-rs", version = "0.8.0" }
half = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
undocumented_unsafe_blocks = "warn"

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[[bin]]
name = "hrxdb-bench"
path = "src/bin/bench.rs"
